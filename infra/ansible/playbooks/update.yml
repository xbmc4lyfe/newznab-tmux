---
- name: NNTmux bare metal update
  hosts: nntmux
  become: true
  gather_facts: false
  serial: 1
  vars:
    nntmux_operation: update
  roles:
    - role: nntmux
  tasks:
    - name: Provision native build prerequisites for the candidate release
      ansible.builtin.import_role:
        name: packages
        tasks_from: native.yml
    - name: Refresh lifecycle helpers before preparing the candidate release
      ansible.builtin.import_role:
        name: base
        tasks_from: lifecycle-helpers.yml
    - name: Prepare and activate the candidate release
      ansible.builtin.import_role:
        name: application
    - name: Verify the updated release
      ansible.builtin.import_role:
        name: lifecycle
