name: Performance reports Pages

on:
  pull_request:
    paths: ['docs/performance/site/**', '.github/workflows/performance-pages.yml']
  push:
    branches: [master]
    paths: ['docs/performance/site/**', '.github/workflows/performance-pages.yml']
  workflow_run:
    workflows: ['Paired native yEnc performance']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-pages-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  build:
    # Never consume a PR workflow_run or content from another repository.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run code always comes from the trusted destination branch.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
          persist-credentials: false
      - name: Verify frozen evidence and prepare site
        shell: bash
        run: |
          cd docs/performance/site
          sha256sum --check SHA256SUMS.txt
          test -s index.html
          test -z "$(find . -type l -print -quit)"
          mkdir -p "$RUNNER_TEMP/performance-site"
          cp -R . "$RUNNER_TEMP/performance-site/"
      - name: Select the newest successful trusted master comparison
        if: github.event_name != 'pull_request'
        id: reports
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'yenc-performance.yml', branch: 'master',
              status: 'success', per_page: 100
            });
            const run = data.workflow_runs.find(r => r.head_branch === 'master' &&
              r.head_repository?.full_name === `${owner}/${repo}` &&
              ['push', 'workflow_dispatch'].includes(r.event));
            if (!run) {
              core.notice('No successful master comparison yet; publishing the frozen reports.');
              return;
            }
            // An older workflow_run must not replace newer completed master evidence.
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: run.id, per_page: 100});
            const selected = {};
            for (const runner of ['ubuntu-latest', 'ubuntu-24.04-arm']) {
              const prefix = `yenc-performance-${runner}-${run.id}-`;
              const candidates = artifacts.filter(a => !a.expired && a.name.startsWith(prefix) &&
                /^[1-9][0-9]*$/.test(a.name.slice(prefix.length)))
                .sort((a, b) => Number(b.name.slice(prefix.length)) - Number(a.name.slice(prefix.length)));
              if (!candidates.length) {
                core.notice(`Master run ${run.id} has no retained ${runner} report; keeping frozen reports.`);
                return;
              }
              selected[runner] = candidates[0];
            }
            const metadata = {
              repository: `${owner}/${repo}`, run_id: run.id, run_url: run.html_url,
              head_sha: run.head_sha, event: run.event, updated_at: run.updated_at,
              artifacts: Object.fromEntries(Object.entries(selected).map(([k, a]) =>
                [k, {id: a.id, name: a.name, digest: a.digest}]))
            };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/performance-run.json`, JSON.stringify(metadata, null, 2) + '\n');
            core.setOutput('run_id', String(run.id));
            core.setOutput('x86', selected['ubuntu-latest'].name);
            core.setOutput('arm', selected['ubuntu-24.04-arm'].name);
      - name: Download selected master artifacts
        if: steps.reports.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.reports.outputs.run_id }}
          pattern: yenc-performance-*-${{ steps.reports.outputs.run_id }}-*
          path: ${{ runner.temp }}/master-evidence
      - name: Publish only report assets and capture receipts
        if: steps.reports.outputs.run_id != ''
        env:
          X86_ARTIFACT: ${{ steps.reports.outputs.x86 }}
          ARM_ARTIFACT: ${{ steps.reports.outputs.arm }}
        shell: bash
        run: |
          shopt -s nullglob
          latest="$RUNNER_TEMP/performance-site/latest"
          for arch in x86 arm; do
            artifact="$X86_ARTIFACT"
            if [[ "$arch" == arm ]]; then artifact="$ARM_ARTIFACT"; fi
            source_dir="$RUNNER_TEMP/master-evidence/$artifact"
            test -s "$source_dir/visualization/report.html"
            test -z "$(find "$source_dir" -type l -print -quit)"
            mkdir -p "$latest/$arch/visualization"
            for asset in "$source_dir"/visualization/*.html "$source_dir"/visualization/*.svg \
              "$source_dir"/visualization/status.json "$source_dir"/visualization/summary.md; do
              test -f "$asset"
              cp "$asset" "$latest/$arch/visualization/"
            done
            for receipt in "$source_dir"/profiles/*/status.json; do
              workload=$(basename "$(dirname "$receipt")")
              destination="$latest/$arch/profiles/$workload"
              mkdir -p "$destination"
              cp "$receipt" "$destination/"
              if [[ -f "$(dirname "$receipt")/native.svg" ]]; then
                cp "$(dirname "$receipt")/native.svg" "$destination/"
              fi
            done
          done
          cp "$RUNNER_TEMP/performance-run.json" "$latest/provenance.json"
          cat > "$latest/index.html" <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Latest master performance reports</title><body>
          <h1>Latest successful master benchmark</h1>
          <p><a href="x86/visualization/report.html">x86 speedups and hot paths</a> · <a href="arm/visualization/report.html">ARM speedups and hot paths</a></p>
          <p><a href="provenance.json">Source commit, CI run and artifact provenance</a> · <a href="../">Frozen comparison and measurement limits</a></p>
          <p>Fixture measurements only. Instrumented profiles do not establish latency or production throughput. Inconclusive results and unavailable captures remain visible.</p>
          </body></html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/performance-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy performance reports
        id: deployment
        uses: actions/deploy-pages@v4
