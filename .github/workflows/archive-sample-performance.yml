name: Archive and sample planning performance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/archive-sample-performance.yml'
      - 'scripts/*benchmark*'
      - 'scripts/composer-install-ci.sh'
      - 'app/Services/Releases/Fingerprint/**'
      - 'app/Services/Releases/Verification/*SpotCheckPlanner.php'
      - 'app/Services/Releases/Verification/*HeaderFilenameIdentity.php'
      - 'app/Services/Binaries/HeaderParser.php'
      - 'app/Services/Binaries/NativePerArticleObfuscation.php'
      - 'tests/Support/PerArticleObfuscationCorpus.php'
      - 'tests/Unit/PerArticleObfuscation*'
      - 'docker/app/nzb-yenc-ffi/**'
      - 'scripts/generate-header-filename-*'
      - 'tests/Support/HeaderFilenameIdentityCorpus.php'
      - 'tests/Unit/*FilenameIdentity*'
      - 'tests/Fixtures/*BenchmarkFixtures.php'
      - 'tests/Fixtures/par2/**'
      - 'tests/Unit/*BenchmarkTest.php'
      - 'tests/Unit/test_benchmark*'
      - 'tests/Unit/test_composer_install_retry.py'
      - 'tests/Unit/test_date_cpp_reference.py'
      - 'tests/Unit/CppDateWorkerTest.php'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:
    inputs:
      comparison:
        type: choice
        options: [remaining, existing, all, date-cpp-screen]
        default: remaining
        description: Select caller families or the fixed descriptive C++ date screen
      mode:
        type: choice
        options: [screen, qualification]
        default: screen
        description: Qualification requires 1000 independent pairs
      samples:
        default: '31'
        description: Pairs per comparative stratum; use at least 1000 for qualification
        required: true

permissions:
  contents: read

# Keep manual measurements independent of automatic push coverage.
concurrency:
  group: archive-sample-performance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  compare:
    name: ${{ matrix.kind }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.comparison == 'date-cpp-screen' && '["ubuntu-24.04-arm"]' || '["ubuntu-latest","ubuntu-24.04-arm"]') }}
        kind: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.comparison == 'date-cpp-screen' && '["date-cpp"]' || github.event_name == 'workflow_dispatch' && inputs.comparison == 'remaining' && '["metadata-modules","archive-modules"]' || github.event_name == 'workflow_dispatch' && inputs.comparison == 'existing' && '["sample-planning","archive-parsing","vendor-archive"]' || '["sample-planning","archive-parsing","vendor-archive","metadata-modules","archive-modules"]') }}
    env:
      RUST_TOOLCHAIN: '1.98.0'
      BENCHMARK_KIND: ${{ matrix.kind }}
      BENCHMARK_MODE: ${{ inputs.mode || 'screen' }}
      BENCHMARK_SAMPLES: ${{ inputs.samples || '31' }}
    steps:
      - name: Require the fixed hosted ARM screen protocol
        if: matrix.kind == 'date-cpp'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_SAMPLES: ${{ inputs.samples }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = ARM64
          test "$REQUESTED_MODE" = screen
          test "$REQUESTED_SAMPLES" = 31
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, curl, exif, ffi, gd, intl, mbstring, mysqlnd, pdo, pdo_mysql, sqlite, pdo_sqlite, simplexml, sockets, xmlwriter, zip
          coverage: none
      - name: Verify locked installation retry policy
        run: python3 -B tests/Unit/test_composer_install_retry.py
      - name: Cache Composer archives without authentication files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nntmux-composer-archives/files
          key: composer-archives-v1-${{ hashFiles('composer.lock') }}
      - name: Install locked dependencies without application boot
        run: bash scripts/composer-install-ci.sh utility-evidence/install
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/nntmux-composer-archives
      - name: Verify benchmark correctness and decisions
        run: |
          php vendor/bin/phpunit tests/Unit/SamplePlanningBenchmarkTest.php tests/Unit/ArchiveParsingBenchmarkTest.php tests/Unit/VendorArchiveBenchmarkTest.php
          php vendor/bin/phpunit tests/Unit/RemainingMetadataBenchmarkFixturesTest.php tests/Unit/RemainingArchiveBenchmarkFixturesTest.php tests/Unit/RemainingModulesBenchmarkTest.php
          php vendor/bin/phpunit --fail-on-skipped --filter=test_date_worker_output_is_capped_after_large_setup_files_exist tests/Unit/RemainingModulesBenchmarkTest.php
          python3 tests/Unit/test_benchmark_callers_export.py
          python3 tests/Unit/test_benchmark_remaining_modules_export.py
          python3 tests/Unit/test_benchmark_resource_limits.py
          python3 -B tests/Unit/test_benchmark_file_limit.py
          python3 -B tests/Unit/test_benchmark_date_build.py
      - name: Build and test optimized locked native library
        shell: bash
        run: |
          mkdir -p utility-evidence/build
          python3 tests/Unit/test_benchmark_toolchain.py
          source scripts/benchmark-rust-toolchain.sh
          cargo +"$RUST_TOOLCHAIN" test --release --locked --manifest-path docker/app/nzb-yenc-ffi/Cargo.toml 2>&1 | tee utility-evidence/build/test.log
          cargo +"$RUST_TOOLCHAIN" build --release --locked --manifest-path docker/app/nzb-yenc-ffi/Cargo.toml --lib 2>&1 | tee utility-evidence/build/build.log
      - name: Verify restricted C++ dates through literal oracles and the actual PHP worker
        if: matrix.kind == 'metadata-modules' || matrix.kind == 'date-cpp'
        shell: bash
        run: |
          umask 077
          mkdir -p utility-evidence/date-cpp-correctness
          php -r 'define("NNTMUX_REMAINING_BENCHMARK_FUNCTIONS_ONLY", true); require "scripts/benchmark-remaining-modules.php"; echo json_encode(remainingBenchmarkSources(getcwd()), JSON_THROW_ON_ERROR);' \
            > utility-evidence/date-cpp-correctness/sources.json
          python3 -B scripts/benchmark-date-build.py \
            --source-dir="$GITHUB_WORKSPACE" \
            --source-manifest="$GITHUB_WORKSPACE/utility-evidence/date-cpp-correctness/sources.json" \
            --output-dir="$GITHUB_WORKSPACE/utility-evidence/date-cpp-correctness/build" \
            > utility-evidence/date-cpp-correctness/build-console.log 2>&1
          NNTMUX_DATE_CPP_LIBRARY="$GITHUB_WORKSPACE/utility-evidence/date-cpp-correctness/build/libdate-reference.so" \
            python3 -B tests/Unit/test_date_cpp_reference.py \
            2>&1 | tee utility-evidence/date-cpp-correctness/python-oracles.log
          NNTMUX_TEST_DATE_CPP_LIBRARY="$GITHUB_WORKSPACE/utility-evidence/date-cpp-correctness/build/libdate-reference.so" \
            php -d ffi.enable=true vendor/bin/phpunit --fail-on-skipped tests/Unit/CppDateWorkerTest.php \
            2>&1 | tee utility-evidence/date-cpp-correctness/php-worker.log
          NNTMUX_TEST_NATIVE_LIBRARY="$GITHUB_WORKSPACE/docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so" \
            php -d ffi.enable=true vendor/bin/phpunit --fail-on-skipped \
            --filter=test_real_linux_native_wrappers_match_all_projection_oracles_and_retain_full_metadata \
            tests/Unit/RemainingMetadataBenchmarkFixturesTest.php \
            2>&1 | tee utility-evidence/date-cpp-correctness/rust-full-oracles.log
      - name: Verify sample planner through the native public caller
        env:
          NNTMUX_TEST_NATIVE_LIBRARY: ${{ github.workspace }}/docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so
        run: |
          php -d ffi.enable=true vendor/bin/phpunit --fail-on-skipped --filter=test_real_native_worker_has_exact_public_caller_output_and_execution_proof
          php -d ffi.enable=true vendor/bin/phpunit --fail-on-skipped --filter=test_all_vendor_archive_native_callers_match_independent_oracles_with_execution_proof
          php -d ffi.enable=true vendor/bin/phpunit --fail-on-skipped --filter='test_real_linux_native_wrappers_match_all_projection_oracles_and_retain_full_metadata|test_real_native_parity_when_explicit_linux_library_is_available'
      - name: Freeze executed build receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path.cwd()
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          code = "define('NNTMUX_REMAINING_BENCHMARK_FUNCTIONS_ONLY', true); require 'scripts/benchmark-remaining-modules.php'; define('NNTMUX_VENDOR_ARCHIVE_BENCHMARK_FUNCTIONS_ONLY', true); require 'scripts/benchmark-vendor-archive.php'; echo json_encode(match (getenv('BENCHMARK_KIND')) {'metadata-modules', 'archive-modules', 'date-cpp' => remainingBenchmarkSources(getcwd()), 'vendor-archive' => vendorArchiveBenchmarkSources(getcwd()), 'archive-parsing' => archiveBenchmarkSources(getcwd()), default => sampleBenchmarkSources(getcwd())}, JSON_THROW_ON_ERROR);"
          sources = json.loads(run('php', '-r', code))
          cpu = next((line.split(':', 1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith(('model name', 'Hardware'))), platform.machine())
          receipt = {
              'executed_sha': run('git', 'rev-parse', 'HEAD'),
              'candidate_library_sha256': digest(root / 'docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so'),
              'candidate_source_sha256': sources,
              'rustc': run('rustup', 'run', os.environ['RUST_TOOLCHAIN'], 'rustc', '-Vv'),
              'cargo': run('rustup', 'run', os.environ['RUST_TOOLCHAIN'], 'cargo', '-V'),
              'php': run('php', '-r', 'echo PHP_VERSION;'),
              'python': platform.python_version(), 'architecture': platform.machine(),
              'cpu_model': cpu, 'logical_cpus': os.cpu_count(),
              'runner_image_os': os.environ.get('ImageOS', ''),
              'runner_image_version': os.environ.get('ImageVersion', ''),
              'build_profile': 'release opt-level=3 lto=true codegen-units=1; cargo --locked; default features',
          }
          pathlib.Path('utility-evidence/runtime.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Capture all visible resource limits before measurement
        shell: bash
        run: |
          ulimit -Sa > utility-evidence/process-soft-limits.txt
          ulimit -Ha > utility-evidence/process-hard-limits.txt
          python3 scripts/benchmark-resource-limits.py capture \
            --soft-limits=utility-evidence/process-soft-limits.txt \
            --hard-limits=utility-evidence/process-hard-limits.txt \
            --output=utility-evidence/resource-limits-before.json
          cp utility-evidence/resource-limits-before.json utility-evidence/resource-limits.json
      - name: Measure actual PHP caller and retain inconclusive qualification
        shell: bash
        run: |
          set +e
          entry="scripts/benchmark-$BENCHMARK_KIND.php"
          family=()
          if [[ "$BENCHMARK_KIND" == metadata-modules || "$BENCHMARK_KIND" == archive-modules ]]; then
            entry=scripts/benchmark-remaining-modules.php
            family=("--family=$BENCHMARK_KIND")
          fi
          command_prefix=()
          baseline_options=()
          if [[ "$BENCHMARK_KIND" == date-cpp ]]; then
            entry=scripts/benchmark-remaining-modules.php
            family=(--family=date-cpp)
            command_prefix=(timeout --signal=TERM --kill-after=5s 180s)
            baseline_options=(
              "--baseline-native=$GITHUB_WORKSPACE/utility-evidence/date-cpp-correctness/build/libdate-reference.so"
              "--baseline-runtime-manifest=$GITHUB_WORKSPACE/utility-evidence/date-cpp-correctness/build/baseline-manifest.json"
              --order-seed=20261015 --timeout=3
            )
          fi
          "${command_prefix[@]}" php -d ffi.enable=true "$entry" "${family[@]}" "${baseline_options[@]}" \
            --native="$GITHUB_WORKSPACE/docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so" \
            --runtime-manifest="$GITHUB_WORKSPACE/utility-evidence/runtime.json" \
            --source-dir="$GITHUB_WORKSPACE" --mode="$BENCHMARK_MODE" --samples="$BENCHMARK_SAMPLES" \
            --output-dir="$GITHUB_WORKSPACE/utility-evidence/$BENCHMARK_KIND" \
            > "utility-evidence/$BENCHMARK_KIND-console.log" 2>&1
          status=$?
          set -e
          echo "$status" > "utility-evidence/$BENCHMARK_KIND-exit.txt"
          # 1 is a valid measured failure to qualify, not a correctness success.
          if [[ "$status" -gt 1 ]]; then exit "$status"; fi
      - name: Capture all visible resource limits after measurement
        if: always()
        shell: bash
        run: |
          mkdir -p utility-evidence
          ulimit -Sa > utility-evidence/process-soft-limits-after.txt
          ulimit -Ha > utility-evidence/process-hard-limits-after.txt
          python3 scripts/benchmark-resource-limits.py capture \
            --soft-limits=utility-evidence/process-soft-limits-after.txt \
            --hard-limits=utility-evidence/process-hard-limits-after.txt \
            --output=utility-evidence/resource-limits-after.json
      - name: Require unchanged visible static limits and retain raw usage endpoints
        if: always()
        run: |
          python3 scripts/benchmark-resource-limits.py compare \
            --before=utility-evidence/resource-limits-before.json \
            --after=utility-evidence/resource-limits-after.json \
            --output=utility-evidence/resource-limits-comparison.json
      - name: Export bounded public metrics even on failure
        if: always() && matrix.kind != 'date-cpp'
        run: python3 scripts/benchmark_callers_summary.py --kind="$BENCHMARK_KIND" --runner='${{ matrix.runner }}' --output=public-summary/summary.json
      - name: Retain public summary
        if: always() && matrix.kind != 'date-cpp'
        uses: actions/upload-artifact@v4
        with:
          name: public-benchmark-${{ matrix.kind }}-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-summary/summary.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain observations and frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-utility-${{ matrix.kind }}-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: utility-evidence/
          retention-days: 14
          if-no-files-found: warn

  # Continuous monitoring of the Rust candidate for HeaderFilenameIdentity::matches. A missed
  # 1.5x threshold is a valid, reported result; only a parity or setup failure fails the job.
  filename-identity:
    name: filename-identity (${{ matrix.runner }})
    if: github.event_name != 'workflow_dispatch' || inputs.comparison != 'date-cpp-screen'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      RUST_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, dom, curl, exif, ffi, gd, intl, mbstring, mysqlnd, pdo, pdo_mysql, sqlite, pdo_sqlite, simplexml, sockets, xmlwriter, zip
          coverage: none
      - name: Cache Composer archives without authentication files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nntmux-composer-archives/files
          key: composer-archives-v1-${{ hashFiles('composer.lock') }}
      - name: Install locked dependencies without application boot
        run: bash scripts/composer-install-ci.sh filename-identity-evidence/install
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/nntmux-composer-archives
      - name: Verify the PHP rule, the golden corpus and the benchmark harness
        run: |
          php vendor/bin/phpunit --fail-on-skipped tests/Unit/HeaderFilenameIdentityTest.php tests/Unit/FilenameIdentityBenchmarkTest.php
          php vendor/bin/phpunit --fail-on-skipped --filter='test_golden_fixture|test_corpus_is_deterministic|test_missing_library' tests/Unit/HeaderFilenameIdentityNativeTest.php
      # The Unicode classes in the Rust port must come from the PCRE this runner's PHP uses; the
      # wrapper refuses a library built from other tables.
      - name: Generate the Unicode tables from this runner's PCRE
        run: php scripts/generate-header-filename-unicode.php > docker/app/nzb-yenc-ffi/src/header_filename_unicode.rs
      - name: Build and test optimized locked native library
        shell: bash
        run: |
          mkdir -p filename-identity-evidence/build
          source scripts/benchmark-rust-toolchain.sh
          cargo +"$RUST_TOOLCHAIN" test --release --locked --manifest-path docker/app/nzb-yenc-ffi/Cargo.toml header_filename 2>&1 | tee filename-identity-evidence/build/test.log
          cargo +"$RUST_TOOLCHAIN" build --release --locked --manifest-path docker/app/nzb-yenc-ffi/Cargo.toml --lib 2>&1 | tee filename-identity-evidence/build/build.log
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          pathlib.Path('filename-identity-evidence/runtime.json').write_text(json.dumps({
              'rustc': run('rustup', 'run', os.environ['RUST_TOOLCHAIN'], 'rustc', '-Vv'),
              'cargo': run('rustup', 'run', os.environ['RUST_TOOLCHAIN'], 'cargo', '-V'),
              'architecture': platform.machine(),
              'runner_image_version': os.environ.get('ImageVersion', ''),
              'build_profile': 'release opt-level=3 lto=true codegen-units=1; cargo --locked; default features',
          }, indent=2) + '\n')
          PY
      - name: Verify native verdict parity through the guarded PHP wrapper
        shell: bash
        env:
          NNTMUX_TEST_NATIVE_LIBRARY: ${{ github.workspace }}/docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so
        run: php -d ffi.enable=true -d memory_limit=1G vendor/bin/phpunit --fail-on-skipped tests/Unit/HeaderFilenameIdentityNativeTest.php 2>&1 | tee filename-identity-evidence/parity.log
      - name: Capture all visible resource limits before measurement
        shell: bash
        run: |
          ulimit -Sa > filename-identity-evidence/process-soft-limits.txt
          ulimit -Ha > filename-identity-evidence/process-hard-limits.txt
          python3 scripts/benchmark-resource-limits.py capture \
            --soft-limits=filename-identity-evidence/process-soft-limits.txt \
            --hard-limits=filename-identity-evidence/process-hard-limits.txt \
            --output=filename-identity-evidence/resource-limits-before.json
          cp filename-identity-evidence/resource-limits-before.json filename-identity-evidence/resource-limits.json
      - name: Measure PHP versus Rust including FFI and report the result
        shell: bash
        run: |
          set +e
          php -d ffi.enable=true scripts/benchmark-filename-identity.php \
            --native="$GITHUB_WORKSPACE/docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so" \
            --runtime-manifest="$GITHUB_WORKSPACE/filename-identity-evidence/runtime.json" \
            --source-dir="$GITHUB_WORKSPACE" \
            --output-dir="$GITHUB_WORKSPACE/filename-identity-evidence/benchmark" \
            > filename-identity-evidence/console.log 2>&1
          status=$?
          set -e
          echo "$status" > filename-identity-evidence/exit.txt
          {
            echo "### Runner: ${{ matrix.runner }}"
            if [[ -f filename-identity-evidence/benchmark/summary.md ]]; then
              cat filename-identity-evidence/benchmark/summary.md
            else
              echo 'Benchmark produced no summary; see the retained console log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A missed threshold exits 0; 2 is an invalid run (parity or setup failure).
          exit "$status"
      # HeaderParser::markPerArticleObfuscated() uses this library's port; a parity failure fails
      # the job, a missed 1.5x threshold is reported.
      - name: Verify per-article obfuscation parity and measure PHP versus Rust including FFI
        shell: bash
        env:
          NNTMUX_TEST_NATIVE_LIBRARY: ${{ github.workspace }}/docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so
        run: |
          source scripts/benchmark-rust-toolchain.sh
          cargo +"$RUST_TOOLCHAIN" test --release --locked --manifest-path docker/app/nzb-yenc-ffi/Cargo.toml --lib per_article_obfuscation
          php -d ffi.enable=true -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Unit/PerArticleObfuscationNativeTest.php
          php -d ffi.enable=true -d memory_limit=3G scripts/benchmark-per-article-obfuscation.php \
            --native="$NNTMUX_TEST_NATIVE_LIBRARY" \
            --output-dir="$GITHUB_WORKSPACE/filename-identity-evidence/per-article-obfuscation" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Capture all visible resource limits after measurement
        if: always()
        shell: bash
        run: |
          mkdir -p filename-identity-evidence
          ulimit -Sa > filename-identity-evidence/process-soft-limits-after.txt
          ulimit -Ha > filename-identity-evidence/process-hard-limits-after.txt
          python3 scripts/benchmark-resource-limits.py capture \
            --soft-limits=filename-identity-evidence/process-soft-limits-after.txt \
            --hard-limits=filename-identity-evidence/process-hard-limits-after.txt \
            --output=filename-identity-evidence/resource-limits-after.json
      - name: Require unchanged visible static limits and retain raw usage endpoints
        if: always()
        run: |
          python3 scripts/benchmark-resource-limits.py compare \
            --before=filename-identity-evidence/resource-limits-before.json \
            --after=filename-identity-evidence/resource-limits-after.json \
            --output=filename-identity-evidence/resource-limits-comparison.json
      - name: Retain observations and frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filename-identity-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: filename-identity-evidence/
          retention-days: 14
          if-no-files-found: warn
