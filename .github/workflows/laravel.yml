name: Run tests

on: [push]

jobs:
  tests:
    # Avoid self-hosted workers that also advertise ubuntu-latest but have no Docker daemon.
    runs-on: [spot, ubuntu-latest]

    strategy:
      fail-fast: true
      matrix:
        php: [ 8.5 ]

    name: PHP ${{ matrix.php }}

    services:
      donor-mariadb:
        image: mariadb:11.4.8
        env:
          MARIADB_ROOT_PASSWORD: donor-fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, ffi, intl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, sqlite, pdo_sqlite
          coverage: none

      - name: Install archive and PAR2 verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y par2 unrar

      # Ubuntu's packaged just (1.21) predates stable modules and quote(); pin a verified release.
      - name: Install just
        env:
          JUST_VERSION: 1.43.0
          JUST_SHA256: a1bc93654f31669fd964ea3011a5e5e9676b9b6f8adcd762606e5140632ea72d
        run: |
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin just
          just --version

      - name: Copy env file
        run:
          cp .env.test .env

      - name: Run composer install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Generate app key
        run: |
          APP_KEY=$(php -r "echo 'base64:' . base64_encode(random_bytes(32));")
          sed -i "s|APP_KEY=.*|APP_KEY=$APP_KEY|" .env

      - name: Cache RapidYenc library
        uses: actions/cache@v4
        with:
          path: storage/app/rapidyenc
          key: rapidyenc-${{ hashFiles('scripts/build-rapidyenc.sh') }}

      - name: Build RapidYenc native library
        run: bash scripts/build-rapidyenc.sh

      - name: Run native yEnc parity tests
        env:
          YENC_NATIVE_LIBRARY: ${{ github.workspace }}/storage/app/rapidyenc/librapidyenc.so
        run: php -d ffi.enable=true vendor/bin/phpunit --fail-on-skipped --filter='YencNativeDecoderTest|YencNativeLibraryTest|YencServiceTest|YencDoctorCommandTest|NNTPBodyDecodingTest|NNTPBoundedArticleTest'

      - name: Install the pinned Rust build toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build native utilities and verification framer
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          CARGO_TARGET_DIR: ${{ github.workspace }}/docker/app/nzb-yenc-ffi/target
        run: |
          bash scripts/build-nntmux-native.sh
          test -x "$CARGO_TARGET_DIR/release/nntmux-verification-framer"
          echo "NNTMUX_VERIFICATION_FRAMER=$CARGO_TARGET_DIR/release/nntmux-verification-framer" >> "$GITHUB_ENV"

      - name: Qualify real PHP and Rust verification framing
        run: php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Unit/NntpVerificationArticleSourceTest.php tests/Unit/RustVerificationFramerTest.php

      - name: Test production PHP article identity without FFI or process spawning
        run: php -d ffi.enable=false -d disable_functions=proc_open vendor/bin/phpunit --fail-on-skipped tests/Unit/Nzb/NzbArticleFingerprintTest.php

      - name: Qualify native PHP directory durability on Linux
        env:
          APP_ENV: testing
          DB_CONNECTION: testing
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php -r 'exit(PHP_OS_FAMILY === "Linux" ? 0 : 1);'
          php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Unit/DirectorySyncBridgeTest.php

      - name: Deployment configuration parser tests
        run: python3 deploy/cloud/tests/test_configuration.py

      - name: Run tests
        run: php -d memory_limit=2G vendor/bin/phpunit

      - name: Qualify PAR2 donor matching against full-schema MariaDB
        env:
          PAR2_DONOR_TEST_HOST: 127.0.0.1
          PAR2_DONOR_TEST_USERNAME: root
          PAR2_DONOR_TEST_PASSWORD: donor-fixture-only
        run: php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Integration/Par2DonorInventoryMariaDbTest.php

      - name: Qualify verification queue preparation against MariaDB
        env:
          PAR2_DONOR_TEST_HOST: 127.0.0.1
          PAR2_DONOR_TEST_USERNAME: root
          PAR2_DONOR_TEST_PASSWORD: donor-fixture-only
        run: php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Integration/VerificationReadyQueueMariaDbTest.php

      - name: Qualify disabled-password additional admission against MariaDB
        env:
          ADDITIONAL_ADMISSION_TEST_HOST: 127.0.0.1
          ADDITIONAL_ADMISSION_TEST_PORT: 3306
          ADDITIONAL_ADMISSION_TEST_USERNAME: root
          ADDITIONAL_ADMISSION_TEST_PASSWORD: donor-fixture-only
        run: php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Integration/AdditionalPasswordDisabledMariaDbTest.php

      - name: Qualify verification ledger and admission locks against MariaDB
        env:
          VERIFICATION_LOCK_TEST_HOST: 127.0.0.1
          VERIFICATION_LOCK_TEST_USERNAME: root
          VERIFICATION_LOCK_TEST_PASSWORD: donor-fixture-only
        run: php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Integration/VerificationLedgerConcurrencyMariaDbTest.php

      - name: Qualify verification candidates and cross-host locks against MariaDB
        env:
          VERIFICATION_MARIADB_TEST: 1
          VERIFICATION_MARIADB_HOST: 127.0.0.1
          VERIFICATION_MARIADB_USERNAME: root
          VERIFICATION_MARIADB_PASSWORD: donor-fixture-only
        run: php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Feature/ReleaseVerificationMariaDbTest.php tests/Feature/ReleaseVerificationDatabaseManifestMariaDbTest.php tests/Feature/VerificationDatabaseLocksMariaDbTest.php tests/Feature/PartialHolderLocksMariaDbTest.php

      - name: Qualify reopened filename lifecycle against MariaDB
        env:
          FILENAME_LIFECYCLE_TEST_HOST: 127.0.0.1
          FILENAME_LIFECYCLE_TEST_PORT: 3306
          FILENAME_LIFECYCLE_TEST_USERNAME: root
          FILENAME_LIFECYCLE_TEST_PASSWORD: donor-fixture-only
        run: php -d memory_limit=2G vendor/bin/phpunit --fail-on-skipped tests/Integration/ReopenedFilenameLifecycleMariaDbTest.php
