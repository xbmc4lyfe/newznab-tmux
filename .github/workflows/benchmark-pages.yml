name: Benchmark Pages

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - '.github/workflows/benchmark-pages.yml'
      - '.github/workflows/yenc-performance.yml'
      - '.github/workflows/release-presentation.yml'
      - 'scripts/*benchmark*'
      - 'tests/Unit/test_benchmark*'
      - 'github-pages/docs/**'
      - 'scripts/build-docs.py'
      - 'tests/Unit/test_docs_site.py'
      - 'scripts/check-docs.py'
      - 'tests/Unit/test_docs_links.py'
      - '.github/workflows/native-utilities-performance.yml'
      - '.github/workflows/archive-sample-performance.yml'
      - 'scripts/benchmark_callers_summary.py'
      - 'scripts/benchmark-resource-limits.py'
      - 'tests/Unit/test_benchmark_callers_export.py'
      - 'tests/Unit/test_benchmark_utility_extended.py'
      - 'tests/Unit/test_benchmark_resource_limits.py'
      - '.gitattributes'
  workflow_run:
    workflows: ['Paired native yEnc performance', 'Rust release presentation', 'Run tests', 'rust-clippy analyze', 'Native utility performance', 'Archive and sample planning performance']
    types: [in_progress, completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize collection as well as deployment. Old completion events refresh the
# current master, and cannot publish an older rendered snapshot after a new one.
concurrency:
  group: benchmark-pages-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          export PYTHONDONTWRITEBYTECODE=1
          python3 tests/Unit/test_benchmark_pages.py
          python3 tests/Unit/test_benchmark_summary_export.py
          python3 tests/Unit/test_benchmark_callers_export.py
          python3 tests/Unit/test_benchmark_utility_extended.py
          python3 tests/Unit/test_benchmark_resource_limits.py
          python3 tests/Unit/test_docs_site.py
          python3 tests/Unit/test_docs_links.py
      - name: Check Google style with pinned Vale
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/vale.tar.gz" https://github.com/vale-cli/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
          echo "867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale" vale
          "$RUNNER_TEMP/vale/vale" --config=github-pages/docs/.vale.ini github-pages/docs/content
      - name: Build and check documentation preview
        run: |
          node --check github-pages/docs/assets/site.js
          bash github-pages/deployment/prepare-benchmarks.sh docs-preview
          echo '{"status":"unavailable","reason":"Preview has no current-build collection"}' > docs-preview/results.json
          python3 scripts/build-docs.py --output=docs-preview
          python3 scripts/check-docs.py --site=docs-preview

  build:
    needs: test
    if: >-
      github.repository == 'xbmc4lyfe/newznab-tmux' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false
      - id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve the reviewed historical reports
        run: |
          if [[ -f github-pages/deployment/prepare-benchmarks.sh ]]; then
            bash github-pages/deployment/prepare-benchmarks.sh benchmark-site
          fi
      - name: Collect current commit and attempt summaries
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.identity.outputs.sha }}
        run: python3 scripts/benchmark-pages.py --sha="$BUILD_SHA" --output=benchmark-site
      - name: Build documentation around current and historical evidence
        run: |
          python3 scripts/build-docs.py --output=benchmark-site
          python3 scripts/check-docs.py --site=benchmark-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: benchmark-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that master still matches the rendered build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          current=$(gh api repos/xbmc4lyfe/newznab-tmux/git/ref/heads/master --jq .object.sha)
          if [[ "$current" == "$BUILD_SHA" ]]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Master advanced; its queued refresh will publish the new build.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.matches == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.matches == 'true'
        id: deployment
