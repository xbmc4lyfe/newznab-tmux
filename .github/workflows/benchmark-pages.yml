name: Benchmark Pages

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - '.github/workflows/benchmark-pages.yml'
      - '.github/workflows/yenc-performance.yml'
      - '.github/workflows/release-presentation.yml'
      - 'scripts/*benchmark*'
      - 'docker/app/nzb-yenc-ffi/**'
      - 'rust/pipeline-ffi/**'
      - 'rust/fingerprint-worker/**'
      - 'tests/Unit/test_benchmark*'
      - 'tests/Unit/test_verify_benchmark_pages.py'
      - 'github-pages/docs/**'
      - 'scripts/build-docs.py'
      - 'tests/Unit/test_docs_site.py'
      - 'scripts/check-docs.py'
      - 'tests/Unit/test_docs_links.py'
      - '.github/workflows/native-utilities-performance.yml'
      - '.github/workflows/archive-sample-performance.yml'
      - '.github/workflows/fingerprint-worker.yml'
      - 'scripts/benchmark_callers_summary.py'
      - 'scripts/benchmark-resource-limits.py'
      - 'tests/Unit/test_benchmark_callers_export.py'
      - 'tests/Unit/test_benchmark_utility_extended.py'
      - 'tests/Unit/test_benchmark_resource_limits.py'
      - '.gitattributes'
  workflow_run:
    workflows: ['Paired native yEnc performance', 'Rust release presentation', 'Run tests', 'rust-clippy analyze', 'Native utility performance', 'Archive and sample planning performance', 'Database Rust fingerprint worker']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: 1

# Distinct per-run concurrency groups with cancel-in-progress: false ensure a
# new workflow run never cancels an in-progress or pending run.
concurrency:
  group: benchmark-pages-${{ github.event_name == 'pull_request' && github.ref || 'master' }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    # Avoid self-hosted workers that also advertise ubuntu-latest without Node.js installed.
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve the source once before testing
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            sha="$EVENT_SHA"
          else
            sha=$(gh api repos/xbmc4lyfe/newznab-tmux/git/ref/heads/master --jq .object.sha)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - run: |
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B tests/Unit/test_benchmark_pages.py
          python3 -B tests/Unit/test_benchmark_pages_completeness.py
          python3 -B tests/Unit/test_verify_benchmark_pages.py
          python3 -B tests/Unit/test_benchmark_concurrency.py
          python3 -B tests/Unit/test_benchmark_rust_inventory.py
          python3 -B tests/Unit/test_benchmark_toolchain.py
          python3 -B scripts/benchmark_rust_inventory.py --check --root .
          python3 -B scripts/benchmark_pipeline_drilldown.py --check --root .
          python3 -B tests/Unit/test_benchmark_pipeline_drilldown.py
          python3 -B tests/Unit/test_benchmark_summary_export.py
          python3 -B tests/Unit/test_benchmark_callers_export.py
          python3 -B tests/Unit/test_benchmark_remaining_modules_export.py
          python3 -B tests/Unit/test_benchmark_utility_extended.py
          python3 -B tests/Unit/test_benchmark_resource_limits.py
          python3 -B tests/Unit/test_docs_site.py
          python3 -B tests/Unit/test_docs_links.py
      - name: Check Google style with pinned Vale
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/vale.tar.gz" https://github.com/vale-cli/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
          echo "867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale" vale
          "$RUNNER_TEMP/vale/vale" --config=github-pages/docs/.vale.ini github-pages/docs/content
      - name: Build and check documentation preview
        run: |
          node --check github-pages/docs/assets/site.js
          bash github-pages/deployment/prepare-benchmarks.sh docs-preview
          echo '{"status":"unavailable","reason":"Preview has no current-build collection"}' > docs-preview/results.json
          python3 -B scripts/build-docs.py --output=docs-preview
          python3 -B scripts/check-docs.py --site=docs-preview

  build:
    needs: test
    if: >-
      github.repository == 'xbmc4lyfe/newznab-tmux' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.test.outputs.sha }}
          persist-credentials: false
      - id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi, mbstring
          coverage: none
      - name: Select the pinned Rust toolchain
        env:
          RUST_TOOLCHAIN: '1.98.0'
          RUSTUP_TOOLCHAIN: '1.98.0'
        shell: bash
        run: source scripts/benchmark-rust-toolchain.sh
      - name: Build native Rust libraries and benchmark all Rust modules
        env:
          RUST_TOOLCHAIN: '1.98.0'
          RUSTUP_TOOLCHAIN: '1.98.0'
        run: |
          cargo build --release --locked --manifest-path rust/pipeline-ffi/Cargo.toml
          cargo build --release --locked --manifest-path docker/app/nzb-yenc-ffi/Cargo.toml
          mkdir -p storage/app/nntmux-native
          cp rust/pipeline-ffi/target/release/libnntmux_pipeline.so storage/app/nntmux-native/
          cp docker/app/nzb-yenc-ffi/target/release/libnzbyenc.so storage/app/nntmux-native/
          php -d ffi.enable=true -d memory_limit=1G scripts/benchmark-pipeline-modules.php --pairs=20 --output=github-pages/docs/data/rust-module-benchmarks.json
          python3 -B scripts/benchmark_pipeline_drilldown.py --check --strict-exports --root .
      - name: Preserve the reviewed historical reports
        run: |
          if [[ -f github-pages/deployment/prepare-benchmarks.sh ]]; then
            bash github-pages/deployment/prepare-benchmarks.sh benchmark-site
          fi
      - name: Collect current commit and attempt summaries
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.identity.outputs.sha }}
        run: python3 -B scripts/benchmark-pages.py --sha="$BUILD_SHA" --output=benchmark-site
      - name: Build documentation around current and historical evidence
        run: |
          python3 -B scripts/build-docs.py --output=benchmark-site
          python3 -B scripts/check-docs.py --site=benchmark-site
      - name: Bind the complete site to the tested source
        env:
          BUILD_SHA: ${{ needs.test.outputs.sha }}
        run: python3 -B scripts/verify-benchmark-pages.py create --site=benchmark-site --sha="$BUILD_SHA"
      - name: Retain the trusted expected publication separately
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-site/publication.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: benchmark-site
      - name: Publish rendered site immediately if newer than live publication
        id: publish_now
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          pub_sha=$(curl -fsSL https://xbmc4lyfe.github.io/newznab-tmux/publication.json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('source_sha',''))" 2>/dev/null || true)
          if [[ -z "$pub_sha" || "$pub_sha" == "$BUILD_SHA" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            rel=$(gh api "repos/xbmc4lyfe/newznab-tmux/compare/${pub_sha}...${BUILD_SHA}" --jq .status 2>/dev/null || echo "ahead")
            if [[ "$rel" == "ahead" || "$rel" == "identical" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/configure-pages@v5
        if: steps.publish_now.outputs.publish == 'true'
        continue-on-error: true
      - uses: actions/deploy-pages@v4
        if: steps.publish_now.outputs.publish == 'true'
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that master still matches the rendered build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          current=$(gh api repos/xbmc4lyfe/newznab-tmux/git/ref/heads/master --jq .object.sha)
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$current" == "$BUILD_SHA" ]]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Master advanced; its queued refresh will publish the new build.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check if rendered build advances the live publication
        id: advances
        if: steps.current.outputs.matches != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
        run: |
          pub_sha=$(curl -fsSL https://xbmc4lyfe.github.io/newznab-tmux/publication.json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('source_sha',''))" 2>/dev/null || true)
          if [[ -z "$pub_sha" || "$pub_sha" == "$BUILD_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            rel=$(gh api "repos/xbmc4lyfe/newznab-tmux/compare/${pub_sha}...${BUILD_SHA}" --jq .status 2>/dev/null || echo "ahead")
            if [[ "$rel" == "ahead" ]]; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/configure-pages@v5
        if: steps.current.outputs.matches == 'true' || steps.advances.outputs.publish == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.matches == 'true' || steps.advances.outputs.publish == 'true'
        id: deployment
      - uses: actions/checkout@v5
        if: steps.current.outputs.matches == 'true'
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: Download the trusted build manifest
        if: steps.current.outputs.matches == 'true'
        uses: actions/download-artifact@v4
        with:
          name: benchmark-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: expected-publication
      - name: Verify the published source and every public file
        if: steps.current.outputs.matches == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          current=$(gh api repos/xbmc4lyfe/newznab-tmux/git/ref/heads/master --jq .object.sha)
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "$current" != "$BUILD_SHA" ]]; then
            echo 'Master advanced; publication verification is superseded by its queued refresh.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python3 -B scripts/verify-benchmark-pages.py verify --manifest=expected-publication/publication.json --sha="$BUILD_SHA" --url="$PAGE_URL"; then
            echo "Verified every published file against tested source $BUILD_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            current=$(gh api repos/xbmc4lyfe/newznab-tmux/git/ref/heads/master --jq .object.sha)
            [[ "$current" =~ ^[0-9a-f]{40}$ ]] || exit 1
            if [[ "$current" != "$BUILD_SHA" ]]; then
              echo 'Master advanced; publication verification is superseded by its queued refresh.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Current-source publication verification failed.' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
