name: Rust indexer

on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/indexer/**'
      - '.github/workflows/rust-indexer.yml'
  push:
    branches: [main]
    paths:
      - 'rust/indexer/**'
      - '.github/workflows/rust-indexer.yml'

permissions:
  contents: read

concurrency:
  group: rust-indexer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-latest
          # The indexer runs on an Apple Silicon Mac.
          - os: macos
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/indexer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/indexer/target
          key: rust-indexer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/indexer/Cargo.lock', 'rust/indexer/rust-toolchain.toml') }}
          restore-keys: rust-indexer-${{ runner.os }}-${{ runner.arch }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Release build
        run: cargo build --locked --release -p indexer
