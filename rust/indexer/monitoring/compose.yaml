# Prometheus, Grafana and Tempo for the indexer, which runs natively on the host.
# Set telemetry.otlp.endpoint = "http://127.0.0.1:4318" to send traces.
#
#   docker compose -f rust/indexer/monitoring/compose.yaml up -d
#
# Everything binds to loopback unless MONITORING_BIND says otherwise, since Grafana
# here allows anonymous read access.
name: indexer-monitoring

services:
  prometheus:
    image: 'prom/prometheus:v3.15.0'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    ports:
      - '${MONITORING_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheus:/prometheus'
    restart: unless-stopped
  tempo:
    image: 'grafana/tempo:2.8.2'
    command: ['-config.file=/etc/tempo.yml']
    # Named volumes start out owned by root, and Tempo otherwise runs as an unprivileged user.
    user: '0'
    ports:
      - '127.0.0.1:4318:4318'
    volumes:
      - './tempo.yml:/etc/tempo.yml:ro'
      - 'tempo:/var/tempo'
    restart: unless-stopped
  grafana:
    image: 'grafana/grafana:13.2.3'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/indexer/indexer.json
    ports:
      - '${MONITORING_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - './grafana/provisioning:/etc/grafana/provisioning:ro'
      - './grafana/dashboards:/etc/grafana/dashboards/indexer:ro'
      - 'grafana:/var/lib/grafana'
    restart: unless-stopped

volumes:
  prometheus:
  tempo:
  grafana:
