# Copy to indexer.toml and pass it with --config. Every key is optional, and these
# are the defaults. INDEXER_TELEMETRY__LOG_FILTER=debug overrides telemetry.log_filter,
# and the other keys follow the same pattern.

[api]
# Serves the Newznab API at /api. The API is off when this is unset.
# listen = "127.0.0.1:5060"
# Keys a client may pass as apikey. Needs at least one when listen is set.
api_keys = []
# The address clients reach the API at, used in NZB links. Defaults to the Host header.
# public_url = "https://indexer.example.test"
# Results per page when a client asks for more, or for none. At most 500.
max_results = 100

[storage]
data_dir = "data"

[telemetry]
# tracing filter directives. RUST_LOG wins when set.
log_filter = "info"
# text or json
log_format = "text"

[telemetry.metrics]
listen = "127.0.0.1:9187"

[telemetry.otlp]
# OTLP/HTTP traces endpoint. Traces are off when this is unset.
# endpoint = "http://127.0.0.1:4318"
sample_ratio = 1.0
