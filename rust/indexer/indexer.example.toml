# Copy to indexer.toml and pass it with --config. Every key is optional, and these
# are the defaults. INDEXER_TELEMETRY__LOG_FILTER=debug overrides telemetry.log_filter,
# and the other keys follow the same pattern.

[storage]
data_dir = "data"

[telemetry]
# tracing filter directives. RUST_LOG wins when set.
log_filter = "info"
# text or json
log_format = "text"

[telemetry.metrics]
listen = "127.0.0.1:9187"

[telemetry.otlp]
# OTLP/HTTP traces endpoint. Traces are off when this is unset.
# endpoint = "http://127.0.0.1:4318"
sample_ratio = 1.0
