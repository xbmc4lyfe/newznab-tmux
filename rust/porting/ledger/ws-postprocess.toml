# Entry points owned by ws-postprocess. Status: todo, ported or dropped (with a note).

[[entry]]
kind = "command"
id = "multiprocessing:postprocess"
source = "app/Console/Commands/ProcessPostProcess.php"
status = "ported"
note = "nntmux-ctl postprocess multiprocess <type> [renamed]. Each GUID bucket is a task in one process instead of a forked postprocess:guid child, bounded by the same thread settings. The postprocess role runs add, nfo, mov and tv in a loop. ani, boo, mus, con, gam and ama run one unbucketed pass and fail until those providers land; anime is out of scope."

[[entry]]
kind = "command"
id = "nntmux:additional-diagnose"
source = "app/Console/Commands/AdditionalProcessingDiagnose.php"
status = "ported"
note = "nntmux-ctl postprocess additional-diagnose. The claim-queue index check accepts the required columns as a prefix; the PHP's exact match reported the shipped index as missing."

[[entry]]
kind = "command"
id = "nntmux:import-nfos"
source = "app/Console/Commands/ImportNfos.php"
status = "ported"
note = "nntmux-ctl releases import-nfos, by ws-releases with the upload manifest it shares. The releases role runs it and nntmux:import-nzbs on NZB_UPLOAD_FOLDER each round."

[[entry]]
kind = "command"
id = "postprocess:guid"
source = "app/Console/Commands/PostProcessGuid.php"
status = "ported"
note = "nntmux-ctl postprocess guid <type> <char> [renamed] [--worker --max-batches --profile]. Book, music, console and game lookups fail until those providers are ported."

[[entry]]
kind = "command"
id = "postprocess:tv-pipeline"
source = "app/Console/Commands/PostProcessTvPipeline.php"
status = "ported"
note = "nntmux-ctl postprocess tv-pipeline <guid> [renamed], over the metadata crate's TV provider pipeline."

[[entry]]
kind = "command"
id = "update:postprocess"
source = "app/Console/Commands/UpdatePostProcess.php"
status = "ported"
note = "nntmux-ctl postprocess update <type>. all runs additional, nfo, movies and tv, skipping the out-of-scope and unported providers. additional uses a worker token of its own, so its workspace never clears other workers' directories. The echo argument is accepted and ignored."
