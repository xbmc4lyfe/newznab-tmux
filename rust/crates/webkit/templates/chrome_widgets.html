<button type="button"
        x-data="backToTop()"
        x-show="visible"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 translate-y-4"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 translate-y-4"
        x-cloak
        @click="scrollToTop()"
        class="fixed z-40 bg-blue-600 dark:bg-blue-700 text-white p-3 rounded-full shadow-lg hover:bg-blue-700 dark:hover:bg-blue-800 transition-colors touch-target
               bottom-[max(5.5rem,calc(env(safe-area-inset-bottom)+5rem))] left-[max(1rem,env(safe-area-inset-left))]
               md:left-auto md:bottom-[max(1rem,env(safe-area-inset-bottom))] md:right-[max(1rem,env(safe-area-inset-right))]"
        aria-label="Back to top">
    <i class="fas fa-chevron-up text-lg"></i>
</button>
<div x-data="toastContainer"
     class="fixed top-4 right-4 z-9999 flex flex-col gap-2 pointer-events-none"
     aria-live="polite"
     aria-atomic="true">
    <template x-for="toast in items()" :key="toast.id">
        <div class="pointer-events-auto max-w-sm w-full bg-white dark:bg-gray-800 shadow-lg rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden transform transition-all duration-300"
             :class="toast.removing ? 'opacity-0 translate-x-full' : 'opacity-100 translate-x-0'"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-x-full"
             x-transition:enter-end="opacity-100 translate-x-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-x-0"
             x-transition:leave-end="opacity-0 translate-x-full">
            <div class="p-4 flex items-start gap-3">
                <div class="shrink-0">
                    <i class="fas"
                       :class="[
                           iconFor(toast.type),
                           toast.type === 'success' ? 'text-green-500' : '',
                           toast.type === 'error' ? 'text-red-500' : '',
                           toast.type === 'warning' ? 'text-yellow-500' : '',
                           toast.type === 'info' ? 'text-blue-500' : ''
                       ]"></i>
                </div>
                <div class="flex-1 text-sm text-gray-700 dark:text-gray-300" x-text="toast.message"></div>
                <button type="button"
                        @click="dismiss(toast.id)"
                        class="shrink-0 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition"
                        aria-label="Dismiss notification">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </template>
</div>
<dialog x-data="confirmModal"
     x-show="open"
     x-modal="open"
     @cancel.prevent="cancel()"
     aria-labelledby="confirmation-title"
     aria-describedby="confirmation-message"
     x-cloak
     class="app-modal confirmation-modal fixed inset-0 bg-gray-900/50 dark:bg-black/70 flex items-center justify-center z-50 transition-opacity"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">
    <div class="confirmation-panel bg-white dark:bg-gray-800 rounded-2xl shadow-xl max-w-md w-full mx-4 transform transition-all"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         @click.outside="cancel()">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between">
                <h3 id="confirmation-title" class="text-lg font-semibold text-gray-900 dark:text-gray-100 flex items-center">
                    <i class="fas mr-2" :class="iconClass()"></i>
                    <span x-text="title">Confirm Action</span>
                </h3>
                <button type="button" @click="cancel()" class="touch-target text-gray-400 hover:text-gray-600 dark:hover:text-gray-300" aria-label="Close confirmation">
                    <i class="fas fa-times text-xl" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <div class="px-6 py-4">
            <p id="confirmation-message" class="text-gray-700 dark:text-gray-300" x-text="message">
                Are you sure you want to proceed?
            </p>
            <div x-show="details" class="bg-gray-50 dark:bg-gray-900 rounded-lg p-3 mt-3">
                <p class="text-sm text-gray-600 dark:text-gray-400" x-text="details"></p>
            </div>
        </div>
        <div class="px-6 py-4 bg-gray-50 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 flex justify-end space-x-3">
            <button type="button"
                    autofocus
                    @click="cancel()"
                    class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition font-medium">
                <i class="fas fa-times mr-2"></i><span x-text="cancelText">Cancel</span>
            </button>
            <button type="button"
                    @click="confirm()"
                    :class="confirmBtnClass()">
                <i class="fas fa-check mr-2"></i><span x-text="confirmText">Confirm</span>
            </button>
        </div>
    </div>
</dialog>
