<div class="release-row-actions" role="group" aria-label="Release actions">
    <a href="/getnzb/{{ result.guid }}" class="download-nzb release-row-actions__download" title="Download NZB">
        <i class="fa fa-download" aria-hidden="true"></i>
        <span>Download</span>
    </a>
    <a href="/details/{{ result.guid }}" class="release-row-actions__details" title="View release details">
        <i class="fa fa-info-circle" aria-hidden="true"></i>
        <span>Details</span>
    </a>
    <button type="button" class="add-to-cart release-row-actions__basket" data-guid="{{ result.guid }}" title="Add to basket">
        <i class="icon_cart fa fa-shopping-basket" aria-hidden="true"></i>
        <span>Add to basket</span>
    </button>
    {% if result.imdb_valid() %}
        <a href="/mymovies?id=add&amp;imdb={{ result.imdbid }}" class="release-row-actions__movies" title="Add to My Movies">
            <i class="fa fa-film" aria-hidden="true"></i>
            <span>My Movies</span>
        </a>
    {% endif %}
    <button type="button" data-report-release-id="{{ result.id }}" class="report-trigger release-action px-3 py-1.5 text-sm {% if result.reports > 0 %}bg-orange-100 dark:bg-orange-900 text-orange-800 dark:text-orange-200 hover:bg-orange-200 dark:hover:bg-orange-800{% else %}bg-red-50 dark:bg-red-400/10 text-red-700 dark:text-red-300 hover:bg-red-100 dark:hover:bg-red-400/20{% endif %}" title="{% if result.reports > 0 %}This release has already been reported. Click to submit another report.{% else %}Report this release{% endif %}"><i class="fas fa-flag mr-1.5"></i><span class="report-label">{% if result.reports > 0 %}Reported{% else %}Report{% endif %}</span></button>
</div>
