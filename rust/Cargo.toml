# Rust-native NNTmux. See WORKSTREAMS.md for how the work is divided.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["indexer", "fingerprint-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
nntmux-admin = { path = "crates/admin" }
nntmux-api = { path = "crates/api" }
nntmux-categorize = { path = "crates/categorize" }
nntmux-core = { path = "crates/core" }
nntmux-db = { path = "crates/db" }
nntmux-fingerprint = { path = "crates/fingerprint" }
nntmux-formats = { path = "crates/formats" }
nntmux-ingest = { path = "crates/ingest" }
nntmux-mail = { path = "crates/mail" }
nntmux-metadata = { path = "crates/metadata" }
nntmux-namefix = { path = "crates/namefix" }
nntmux-nntp = { path = "crates/nntp" }
nntmux-ops = { path = "crates/ops" }
nntmux-postprocess = { path = "crates/postprocess" }
nntmux-predb = { path = "crates/predb" }
nntmux-releases = { path = "crates/releases" }
nntmux-runtime = { path = "crates/runtime" }
nntmux-search = { path = "crates/search" }
nntmux-site = { path = "crates/site" }
nntmux-supervisor = { path = "crates/supervisor" }
nntmux-telemetry = { path = "crates/telemetry" }
nntmux-testkit = { path = "crates/testkit" }
nntmux-verify = { path = "crates/verify" }
nntmux-webkit = { path = "crates/webkit" }
nntmux-yenc = { path = "crates/yenc" }

anyhow = "1"
askama = "0.16"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
base64 = "0.22"
bcrypt = "0.19"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
deunicode = "1"
fancy-regex = "0.17"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
form_urlencoded = "1"
futures-util = "0.3"
hex = "0.4"
hickory-resolver = { version = "0.25", default-features = false, features = ["system-config", "tokio"] }
hmac = "0.12"
ipnet = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "tokio1"] }
md-5 = "0.10"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
quick-xml = { version = "0.42", features = ["serialize"] }
rand = "0.9"
redis = { version = "1", default-features = false, features = ["aio", "connection-manager", "tokio-rustls-comp", "script"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "gzip", "json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "mysql", "runtime-tokio", "tls-rustls-ring-webpki"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
totp-rs = "6"
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-gzip", "fs", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
webauthn-rs = "0.6"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
