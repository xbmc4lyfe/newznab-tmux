# Prometheus config for the docker/ stack (docker/docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Capacity and stall alerts (docker/monitoring/prometheus/rules).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: mariadb
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: manticore
    static_configs:
      - targets: ['manticore:9308']

  # Every Rust service serves /metrics on 9187. Roles in the Compose `pending` profile aren't
  # listed, so ExporterDown doesn't fire for them; add a role here in the PR that ports it.
  - job_name: nntmux-roles
    static_configs:
      - targets:
          - web:9187
          - supervisor:9187
          - releases:9187
          - fixnames:9187
          - predb:9187
          - fingerprint:9187
          - verify:9187
          - search-sync:9187
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: role

  # Database-derived NNTmux metrics pushed every minute by the supervisor's metrics export.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
