# NNTmux self-hosted stack, Rust-native. Persistent state is bind-mounted under docker/data and
# docker/logs. Lifecycle: just --justfile docker/Justfile help
#
# Every app service runs the same image (nntmux/rust:local) with a different command. Workers
# drain on SIGTERM: they stop claiming, finish in-flight units and exit, so `docker compose up -d`
# with a new image is a safe rolling restart. `migrate` runs first and every app service waits
# for it, so schema changes land before any new binary starts.
#
# Roles that aren't ported yet sit in the `pending` profile so a normal `up` doesn't start a
# service that exits at once. Move a role out of the profile in the PR that ports it.
name: ${COMPOSE_PROJECT_NAME:-nntmux}

x-app: &app
  image: ${APP_IMAGE:-nntmux/rust:local}
  init: true
  user: "33:33"
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 120s
  env_file: ./config/app.env
  environment:
    TZ: ${TZ:-UTC}
  volumes:
    - ./data/storage:/app/storage
  tmpfs:
    - /var/tmp/nntmux:uid=33,gid=33,mode=0770,size=2g
  networks: [nntmux]
  # Every role serves /metrics and /healthz here; Prometheus scrapes it.
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9187/healthz"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  depends_on: &app-depends
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    manticore:
      condition: service_healthy

x-worker-memory: &worker-memory
  mem_limit: ${WORKER_MEMORY:-2g}

services:
  # One-shot: applies pending migrations, then exits 0. It refuses a database that has tables
  # but neither a rust_migrations record nor the full Laravel baseline.
  migrate:
    <<: *app
    restart: "no"
    command: ["nntmux-ctl", "migrate"]
    healthcheck:
      disable: true
    depends_on:
      mariadb:
        condition: service_healthy
        required: false

  proxy:
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine}
    restart: unless-stopped
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
      - "${INTERNAL_BIND:-127.0.0.1}:${INTERNAL_PORT:-8090}:8090"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./logs/caddy:/var/log/caddy
    networks: [nntmux]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 256m

  # The newznab API, RSS, NZB downloads and the site.
  web:
    <<: *app
    command: ["nntmux-web"]
    stop_grace_period: 30s
    mem_limit: ${WEB_MEMORY:-1g}

  # Scheduled tasks (the Laravel scheduler's replacement). Takes a database lease, so a second
  # copy waits instead of running tasks twice.
  supervisor:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "supervisor"]

  releases:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "releases"]

  fixnames:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "fixnames"]

  predb:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "predb"]

  # Fingerprint and verify units fetch from NNTP and can run for many minutes; give them the
  # same 1920s grace Horizon had, so a rollout never cuts one off.
  fingerprint:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "fingerprint"]
    stop_grace_period: 1920s

  verify:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "verify"]
    stop_grace_period: 1920s

  search-sync:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "search-sync"]

  # Header ingest and backfill fetch from NNTP. On SIGTERM they finish the header ranges in
  # flight and defer the rest to the next pass.
  # A header job may run for NN_MULTIPROCESSING_MAX_CHILD_TIME (1800 s by default). On SIGTERM
  # these roles stop claiming and finish the jobs in flight, so the grace covers a whole job.
  ingest:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "ingest"]
    stop_grace_period: 1920s

  backfill:
    <<: [*app, *worker-memory]
    command: ["nntmux-worker", "backfill"]
    stop_grace_period: 1920s

  # ── Pending: postprocess isn't ported yet (ws-postprocess); mail waits until account mail is
  #    configured. `--profile pending` starts them. ──
  postprocess:
    <<: *app
    profiles: [pending]
    command: ["nntmux-worker", "postprocess"]
    stop_grace_period: 1920s
    mem_limit: ${POSTPROCESS_MEMORY:-4g}

  mail:
    <<: [*app, *worker-memory]
    profiles: [pending]
    command: ["nntmux-worker", "mail"]

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4.8}
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_DATABASE: ${DB_DATABASE:-nntmux}
      MARIADB_USER: ${DB_USERNAME:-nntmux}
      MARIADB_PASSWORD: ${DB_PASSWORD:?run docker/bin/generate-env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOTPASSWORD:?run docker/bin/generate-env}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./config/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./logs/mariadb:/var/log/mysql
    networks: [nntmux]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: ${MARIADB_MEMORY:-13g}

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
    networks: [nntmux]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEMORY:-1g}

  manticore:
    image: ${MANTICORE_IMAGE:-manticoresearch/manticore:28.4.4}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      EXTRA: "1"
    volumes:
      - ./config/manticore/manticore.conf:/etc/manticoresearch/manticore.conf
      - ./data/manticore:/var/lib/manticore
      - ./logs/manticore:/var/log/manticore
    networks: [nntmux]
    ulimits:
      nproc: 65535
      nofile:
        soft: 1048576
        hard: 1048576
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "mysql", "-h127.0.0.1", "-P9306", "-e", "SHOW TABLES"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${MANTICORE_MEMORY:-3g}

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [nntmux]
    mem_limit: 128m

  # ── Monitoring (Prometheus + Grafana); dashboards shared with docker/monitoring ──
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./data/prometheus:/prometheus
    networks: [nntmux]
    mem_limit: 512m

  pushgateway:
    image: prom/pushgateway:v1.11.3
    restart: unless-stopped
    networks: [nntmux]
    mem_limit: 128m

  # Phase 1 has no admin UI to sign Grafana in, so Grafana uses its own login on a local port.
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    user: "0:0"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_USER: nntmux-grafana-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run docker/bin/generate-env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/nntmux/nntmux-host.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards/nntmux:ro
      - ./data/grafana:/var/lib/grafana
    networks: [nntmux]
    mem_limit: 512m

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks: [nntmux]
    mem_limit: 64m

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_ROOTPASSWORD}
    networks: [nntmux]
    depends_on: [mariadb]
    mem_limit: 64m

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [nntmux]
    depends_on: [redis]
    mem_limit: 64m

networks:
  nntmux:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.42.0/24
