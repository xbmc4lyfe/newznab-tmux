# Remote release-verification worker host. It runs only this host's verification slots against
# the primary's shared MariaDB, and publishes spot-checked candidates through the primary's
# internal endpoint (INTERNAL_BIND/INTERNAL_PORT there), so it needs no NZB storage, Redis or
# Manticore of its own.
#
# Setup on the worker host, from this directory:
#   1. Copy config/app.env.example to config/app.env and fill in the database login, this host's
#      NNTP account, RELEASE_VERIFICATION_HOST and a slot range no other host uses.
#   2. Copy the database CA to config/ca.pem (the primary mounts the same file), and
#      `touch config/install.lock`: the shared database is already initialized by the primary.
#   3. Load the primary's exact scheduler role image (the verifier runs the scheduler), for example
#        ssh <primary> 'docker save nntmux/scheduler:local' | docker load
#      Run the image the primary runs; a worker on older code must not run after a migration.
#   4. docker compose up -d
#
# Before the primary migrates verification tables, stop these workers (docker compose stop lets the
# scheduler finish its active candidates) and start them again on the new image afterwards.
name: ${COMPOSE_PROJECT_NAME:-nntmux-worker}

services:
  verifier:
    image: ${APP_IMAGE:-nntmux/scheduler:local}
    init: true
    user: "33:33"
    restart: unless-stopped
    stop_signal: SIGTERM
    # Detached verification runs remain owned by the subreaper until they finish (at most
    # RELEASE_VERIFICATION_WORKER_SECONDS plus the active candidate).
    stop_grace_period: 900s
    command: ["python3", "/app/docker/app/bin/scheduler.py"]
    environment:
      TZ: ${TZ:-UTC}
      SHELL: /bin/bash
      PULSE_ENABLED: "false"
    volumes:
      - ./config/app.env:/app/.env:ro
      - ./config/ca.pem:/etc/mysql/ssl/ca.pem:ro
      - ./config/install.lock:/app/_install/install.lock:ro
      - storage:/app/storage
    tmpfs:
      - /var/tmp/nntmux:uid=33,gid=33,mode=0770,size=256m
    healthcheck:
      test: ["CMD", "python3", "/app/docker/app/bin/scheduler.py", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: ${VERIFIER_MEMORY:-16g}

volumes:
  storage:
