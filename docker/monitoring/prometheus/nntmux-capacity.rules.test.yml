# promtool test rules docker/monitoring/prometheus/nntmux-capacity.rules.test.yml
rule_files: [rules/nntmux-capacity.rules.yml]
evaluation_interval: 1m
tests:
  # Saturated and falling behind: 70/73 primary connections, backlog +10/min, no new releases.
  - interval: 1m
    input_series:
      - series: 'nntmux_nntp_connections{server="primary",state="active"}'
        values: '70x300'
      - series: 'nntmux_processing_total_work'
        values: '6000+10x300'
      - series: 'nntmux_releases'
        values: '1000x300'
      - series: 'nntmux_table_rows{table="collections"}'
        values: '100x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: NntmuxAtCapacity
        exp_alerts:
          - exp_annotations: {summary: "NNTP connections near budget while backlog grows: add connections/workers or cut per-item cost."}
      - eval_time: 4h
        alertname: NntmuxReleaseCreationStalled
        exp_alerts:
          - exp_annotations: {summary: "Release total has not grown for about 3h while collections are waiting (deletions can mask creation)."}
      - eval_time: 4h
        alertname: NntmuxPostprocessBacklogGrowing
        exp_alerts:
          - exp_annotations: {summary: "Post-processing backlog growing >180/h for 2h: identification is behind."}
      - eval_time: 4h
        alertname: NntmuxUnderUtilized
        exp_alerts: []

  # Healthy: releases growing, flat backlog, half the connections busy.
  - interval: 1m
    input_series:
      - series: 'nntmux_nntp_connections{server="primary",state="active"}'
        values: '40x300'
      - series: 'nntmux_processing_total_work'
        values: '6000x300'
      - series: 'nntmux_releases'
        values: '1000+5x300'
      - series: 'nntmux_table_rows{table="collections"}'
        values: '100x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: NntmuxAtCapacity
        exp_alerts: []
      - eval_time: 4h
        alertname: NntmuxReleaseCreationStalled
        exp_alerts: []
      - eval_time: 4h
        alertname: NntmuxPostprocessBacklogGrowing
        exp_alerts: []

  # Monitor died: the snapshot expires and only the availability gauge remains.
  - interval: 1m
    input_series:
      - series: 'nntmux_tmux_snapshot_available'
        values: '1x10 0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: NntmuxTmuxSnapshotMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: NntmuxTmuxSnapshotMissing
        exp_alerts:
          - exp_annotations: {summary: "No tmux monitor snapshot: the monitor is down and processing gauges are absent."}

  # Read-only squashfs is always full and must not page; a full ext4 root must.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="squashfs",mountpoint="/snap/core/1"}'
        values: '0x30'
      - series: 'node_filesystem_size_bytes{fstype="squashfs",mountpoint="/snap/core/1"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/"}'
        values: '5x30'
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HostDiskLow
        exp_alerts:
          - exp_labels: {fstype: ext4, mountpoint: /}
            exp_annotations: {summary: "A filesystem has under 10% free."}

  # No push has ever reached the Pushgateway, then pushes resume.
  - interval: 1m
    input_series:
      - series: 'push_time_seconds{job="nntmux"}'
        values: '_x20 1260+60x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: NntmuxAppMetricsStale
        exp_alerts:
          - exp_labels: {job: nntmux}
            exp_annotations: {summary: "App metrics missing or not pushed for >5m; every other app alert is blind."}
      - eval_time: 30m
        alertname: NntmuxAppMetricsStale
        exp_alerts: []
