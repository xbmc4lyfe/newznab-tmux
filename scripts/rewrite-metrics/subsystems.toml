# Subsystem map and cutover ledger for the Rust rewrite.
#
# Each PHP file under app/ belongs to the first subsystem whose `paths` regex
# (matched against the repo-relative path) fits. Files that match nothing land in
# "platform". Keep this file in the repo next to the Rust workspace and update
# `status` only with production evidence.
#
# status values, in order:
#   php        PHP serves production; no Rust replacement yet
#   shadow     Rust runs in production beside PHP and its output is compared
#   rust       Rust serves production; PHP still in the tree as fallback
#   deleted    Rust serves production AND the subsystem's PHP is gone (done)
#
# evidence: link to the PR that flipped the status plus the deploy log line or
# Grafana panel that proves production runs it.

# progress.py adds the headline. baseline_live is this subsystem's live PHP at the
# baseline commit. workstreams and crates map it to the ledgers and Rust crates on
# rust-native. Entries of a workstream that's shared or not listed go by their source
# path, and a crate that isn't listed counts toward platform.
#
# Baseline = the last tree before any pipeline-ffi work (#301, 2026-10-23).
# progress_pct = share of these live PHP lines that are gone.
[baseline]
commit = "eb5e2de"
date = "2026-10-23"
live_lines = 188303
total_lines = 196448

[ledger]
# Vendor routes (forum, Horizon, Pulse): dropped, but they have no lines in app/.
excluded = ["dropped"]
# Shared code with no entry points of its own. It's retired as everything else is.
follows_rest = ["platform"]

[[subsystem]]
key = "ingest"
baseline_live = 12279
workstreams = ["ws-ingest", "ws-formats"]
crates = ["ingest", "nntp", "yenc"]
title = "Headers, binaries, backfill, NNTP, yEnc"
phase = 2
status = "php"
evidence = ""
paths = [
  '^app/Services/(Binaries|Backfill|NNTP|Yenc)/',
  '^app/Services/(YencService|XrefService|BlacklistService|RegexService|CollectionCleanupService|CollectionsCleaningService)\.php$',
